<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#451a03"/>
            <stop offset="100%" stop-color="#292524"/>
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d97706"/>
            <stop offset="100%" stop-color="#ffffff"/>
        </linearGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.07"/>
        </pattern>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="600" height="600" fill="url(#bgGrad)"/>
    <rect width="600" height="600" fill="url(#grid)"/>

    <!-- Decorative Circles -->
    <circle cx="500" cy="100" r="180" fill="#d97706" opacity="0.08"/>
    <circle cx="100" cy="500" r="140" fill="#d97706" opacity="0.05"/>

    <!-- Central Card Badge -->
    <g transform="translate(140, 130)" filter="url(#shadow)">
        <rect width="320" height="340" rx="24" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-width="1.5"/>
        
        <!-- Icon Graphic -->
        <g transform="translate(0, -10)">
            
                <path d="M120 180 C110 240, 210 240, 200 180 C195 150, 125 150, 120 180 Z" fill="#d97706" opacity="0.9"/>
                <path d="M160 155 Q160 215 160 235" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
                <path d="M200 190 Q225 190 225 210 Q225 230 200 230" stroke="#d97706" stroke-width="6" fill="none"/>
                <circle cx="130" cy="110" r="15" fill="none" stroke="#d97706" stroke-width="2" opacity="0.4"/>
                <circle cx="160" cy="95" r="20" fill="none" stroke="#d97706" stroke-width="2" opacity="0.6"/>
                <circle cx="190" cy="115" r="12" fill="none" stroke="#d97706" stroke-width="2" opacity="0.3"/>
            
        </g>

        <!-- Product Name & Subtitle -->
        <text x="160" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" letter-spacing="0.5">Ethiopian Arabica Coffee</text>
        <text x="160" y="295" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#d97706" opacity="0.9">Specialty &amp; Commercial Coffee</text>
    </g>

    <!-- Category Pill Badge -->
    <rect x="40" y="40" width="180" height="32" rx="16" fill="#d97706" opacity="0.2"/>
    <text x="130" y="61" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" letter-spacing="1">COOPER TRADING</text>
</svg>