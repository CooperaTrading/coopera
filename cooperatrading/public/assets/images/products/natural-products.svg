<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d97706"/>
            <stop offset="100%" stop-color="#b45309"/>
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a"/>
            <stop offset="100%" stop-color="#ffffff"/>
        </linearGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.07"/>
        </pattern>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="600" height="600" fill="url(#bgGrad)"/>
    <rect width="600" height="600" fill="url(#grid)"/>

    <!-- Decorative Circles -->
    <circle cx="500" cy="100" r="180" fill="#fef08a" opacity="0.08"/>
    <circle cx="100" cy="500" r="140" fill="#fef08a" opacity="0.05"/>

    <!-- Central Card Badge -->
    <g transform="translate(140, 130)" filter="url(#shadow)">
        <rect width="320" height="340" rx="24" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-width="1.5"/>
        
        <!-- Icon Graphic -->
        <g transform="translate(0, -10)">
            
                <circle cx="160" cy="170" r="60" fill="none" stroke="#fef08a" stroke-width="6"/>
                <polygon points="160,130 195,190 125,190" fill="#fef08a" opacity="0.8"/>
                <circle cx="160" cy="170" r="10" fill="#ffffff"/>
            
        </g>

        <!-- Product Name & Subtitle -->
        <text x="160" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" letter-spacing="0.5">Natural Honey &amp; Beeswax</text>
        <text x="160" y="295" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#fef08a" opacity="0.9">Pure Organic Ethiopian Products</text>
    </g>

    <!-- Category Pill Badge -->
    <rect x="40" y="40" width="180" height="32" rx="16" fill="#fef08a" opacity="0.2"/>
    <text x="130" y="61" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" letter-spacing="1">COOPER TRADING</text>
</svg>