<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284c7"/>
            <stop offset="100%" stop-color="#0369a1"/>
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#67e8f9"/>
            <stop offset="100%" stop-color="#ffffff"/>
        </linearGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.07"/>
        </pattern>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="600" height="600" fill="url(#bgGrad)"/>
    <rect width="600" height="600" fill="url(#grid)"/>

    <!-- Decorative Circles -->
    <circle cx="500" cy="100" r="180" fill="#67e8f9" opacity="0.08"/>
    <circle cx="100" cy="500" r="140" fill="#67e8f9" opacity="0.05"/>

    <!-- Central Card Badge -->
    <g transform="translate(140, 130)" filter="url(#shadow)">
        <rect width="320" height="340" rx="24" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-width="1.5"/>
        
        <!-- Icon Graphic -->
        <g transform="translate(0, -10)">
            
                <path d="M160 100 C160 100 210 170 210 200 C210 227 187 250 160 250 C133 250 110 227 110 200 C110 170 160 100 160 100 Z" fill="#67e8f9" opacity="0.85"/>
                <ellipse cx="145" cy="190" rx="15" ry="25" fill="#ffffff" opacity="0.3" transform="rotate(-20 145 190)"/>
            
        </g>

        <!-- Product Name & Subtitle -->
        <text x="160" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" letter-spacing="0.5">Water Chemicals</text>
        <text x="160" y="295" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#67e8f9" opacity="0.9">Coagulants &amp; Flocculants</text>
    </g>

    <!-- Category Pill Badge -->
    <rect x="40" y="40" width="180" height="32" rx="16" fill="#67e8f9" opacity="0.2"/>
    <text x="130" y="61" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" letter-spacing="1">COOPER TRADING</text>
</svg>